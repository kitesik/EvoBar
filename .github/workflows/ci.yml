name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build and run unit tests
        env:
          EVOBAR_SWIFTPM_SCRATCH: ${{ runner.temp }}/EvoBarSwiftPM
        run: ./Scripts/check.sh

      - name: Build Universal 2 app bundle
        env:
          EVOBAR_SWIFTPM_SCRATCH: ${{ runner.temp }}/EvoBarSwiftPM
        run: ./Scripts/build-app.sh

      - name: Upload unsigned app artifact
        uses: actions/upload-artifact@v4
        with:
          name: EvoBar-unsigned-${{ github.sha }}
          path: build/EvoBar.app
          if-no-files-found: error
          retention-days: 7


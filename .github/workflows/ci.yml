name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: swift --version

      - name: Build and run unit tests
        env:
          EVOBAR_SWIFTPM_SCRATCH: ${{ runner.temp }}/EvoBarSwiftPM
        run: ./Scripts/check.sh

      - name: Build unsigned release candidate
        env:
          EVOBAR_SWIFTPM_SCRATCH: ${{ runner.temp }}/EvoBarSwiftPM
          EVOBAR_ALLOW_UNSIGNED: "1"
        run: ./Scripts/package-release.sh 0.1.0

      - name: Launch packaged app smoke test
        run: ./Scripts/smoke-test-app.sh build/EvoBar.app

      - name: Upload unsigned release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EvoBar-unsigned-${{ github.sha }}
          path: |
            build/release/EvoBar-0.1.0-macos-universal.zip
            build/release/EvoBar-0.1.0-macos-universal.zip.sha256
            build/release/EvoBar.rb
          if-no-files-found: error
          retention-days: 7

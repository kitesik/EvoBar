name: Publish signed release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sign-notarize-and-draft:
    name: Sign, notarize, and create draft
    runs-on: macos-15
    timeout-minutes: 45
    environment: release

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate tag and release secrets
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_DEVELOPER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          required=(
            APPLE_DEVELOPER_ID_P12_BASE64
            APPLE_DEVELOPER_ID_P12_PASSWORD
            APPLE_DEVELOPER_IDENTITY
            APPLE_NOTARY_ISSUER_ID
            APPLE_NOTARY_KEY_ID
            APPLE_NOTARY_PRIVATE_KEY_BASE64
          )
          for variable in "${required[@]}"; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Required release secret is missing: $variable" >&2
              exit 1
            fi
          done
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "A GitHub Release already exists for $GITHUB_REF_NAME; published versions are immutable." >&2
            exit 1
          fi

      - name: Install signing and notarization credentials
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/evobar-release.keychain-db"
          keychain_password="$(uuidgen)$(uuidgen)"
          certificate_path="$RUNNER_TEMP/DeveloperID.p12"
          api_key_path="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$certificate_path" "$api_key_path"' EXIT

          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY_BASE64" | base64 --decode > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          xcrun notarytool store-credentials EvoBarCI \
            --key "$api_key_path" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --keychain "$keychain_path"

      - name: Build and test tagged source
        env:
          EVOBAR_SWIFTPM_SCRATCH: ${{ runner.temp }}/EvoBarSwiftPM
        run: ./Scripts/check.sh

      - name: Build signed and notarized release
        env:
          EVOBAR_BUILD_VERSION: ${{ github.run_number }}
          EVOBAR_NOTARY_KEYCHAIN: ${{ runner.temp }}/evobar-release.keychain-db
          EVOBAR_NOTARY_PROFILE: EvoBarCI
          EVOBAR_SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
          EVOBAR_SWIFTPM_SCRATCH: ${{ runner.temp }}/EvoBarSwiftPM
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          ./Scripts/package-release.sh "$version"

      - name: Create immutable draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "build/release/EvoBar-$version-macos-universal.zip" \
            "build/release/EvoBar-$version-macos-universal.zip.sha256" \
            "build/release/EvoBar.rb" \
            "PRIVACY.md" \
            --draft \
            --generate-notes \
            --title "EvoBar $version" \
            --verify-tag

      - name: Remove temporary keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/evobar-release.keychain-db" || true
